[globalOptions]

# Please set the pcrglobwb output directory (outputDir) in an absolute path.
# - Please make sure that you have access to it. 
#~ outputDir = /scratch/sutan101/pcrglobwb2_output_test_on_velocity/05min/
#outputDir    = /scratch/carde003/qualloc/outputs/coupled/pcrglobwb_noqualloc/
outputDir = /gpfs/scratch1/shared/dynql/dynql/


# Please set the clone map file (cloneMap), which defines the spatial resolution and extent of your study area.
# - Please make sure that the file is stored locally in your computing machine.
# - The file must be in the pcraster format.
#cloneMap   = /data/hydroworld/pcrglobwb2_input_release/version_2019_11_beta/pcrglobwb2_input/global_05min/cloneMaps/RhineMeuse05min.clone.map
#cloneMap   = /data/hydroworld/pcrglobwb2_input_release/version_2019_11_beta/pcrglobwb2_input/global_05min/cloneMaps/clone_global_05min.map
#cloneMap    = /data/hydroworld/others/Java/Java05min.clone.map
cloneMap = clone_maps/RhineMeuse_05min.map


# Set the input directory map in an absolute path. The input forcing and parameter directories and files will be relative to this.
# - The following is an example using files from the opendap server.
#inputDir   = https://opendap.4tu.nl/thredds/dodsC/data2/pcrglobwb/version_2019_11_beta/pcrglobwb2_input/
# - The following is an example using input files stored locally in your computing machine.
#inputDir    = /data/hydroworld/pcrglobwb2_input_release/version_2019_11_beta/pcrglobwb2_input/
inputDir    = /gpfs/work4/0/dynql/input/

# The area/landmask of interest:
# If None, area/landmask is limited for cells with ldd value. 
#~ landmask = /data/hydroworld/pcrglobwb2_input_release/version_2019_11_beta/pcrglobwb2_input/global_05min/cloneMaps/RhineMeuse05min.landmask.map
#landmask    = None
landmask = clone_maps/RhineMeuse_05min.map


# netcdf attributes for output files:
institution = Department of Physical Geography, Utrecht University
title       = PCR-GLOBWB 2 output, with human factors (non-natural)
description = PCR-GLOBWB run with human factors (non-natural) at 5 arcmin resolution


#~ startTime = 2000-01-01
startTime = 2000-01-01
endTime   = 2000-12-31
# Format: YYYY-MM-DD ; The model runs on daily time step.


# spinning up options:
maxSpinUpsInYears = 0
minConvForSoilSto = 0.0
minConvForGwatSto = 0.0
minConvForChanSto = 0.0
minConvForTotlSto = 0.0


[meteoOptions]

# Set the forcing temperature and precipitation files (relative to inputDir)
#precipitationNC = global_30min/meteo/forcing/daily_precipitation_cru_era-interim_1979_to_2010.nc
#temperatureNC   = global_30min/meteo/forcing/daily_temperature_cru_era-interim_1979_to_2010.nc

precipitationNC = forcing/historical/W5E5/pr_W5E5v2.0_19790101-20191231_with_climatology_on_1978_mday-1.nc
temperatureNC   = forcing/historical/W5E5/tas_W5E5v2.0_19790101-20191231_with_climatology_on_1978_C.nc

# Method to calculate referencePotETP (reference potential evaporation+transpiration)
# options are "Hamon" and "Input" ; If "Input", the netcdf input file must be given:
referenceETPotMethod = Input
#refETPotFileNC  = global_30min/meteo/forcing/daily_referencePotET_cru_era-interim_1979_to_2010.nc
refETPotFileNC = forcing/historical/W5E5/epot_W5E5_19790101_20191231_mday-1.nc


#Set the additional forcing needed for water temperature module (e.g. cloudcover, radiation and vapor pressure files)
cloudcoverNC = forcing/historical/W5E5/cloudCover_cru_ts3.21.nc
radiationNC   =  forcing/historical/W5E5/rsds_W5E5v2.0_19790101-20191231_with_climatology_on_1978_wm-2.nc
vaporNC   = forcing/historical/W5E5/vap_cru_ts3.21.nc
annualAvgTNC   =  forcing/historical/W5E5/tas_W5E5v2.0_19790101-20191231_annAvg_C.nc
sunhoursTable = forcing/historical/sunhoursfrac.tbl


[meteoDownscalingOptions]
# This section is for a 5 arcmin run, for downscaling meteorological forcing at 30 arcmin to 5 arcmin.  
downscalePrecipitation  = True
downscaleTemperature    = True
downscaleReferenceETPot = False
   
# downscaling (based on the digital elevation model):
# The downscaling will be performed by providing the "cellIds" (meteoDownscaleIds) of lower resolution cells.
meteoDownscaleIds = global_05min/meteo/downscaling_from_30min/uniqueIds_30min.nc
highResolutionDEM = global_05min/meteo/downscaling_from_30min/gtopo05min.nc

# lapse rates:
temperLapseRateNC = global_05min/meteo/downscaling_from_30min/temperature_slope.nc
precipLapseRateNC = global_05min/meteo/downscaling_from_30min/precipitation_slope.nc

# downscaling criteria (TODO: remove these):
temperatCorrelNC  = global_05min/meteo/downscaling_from_30min/temperature_correl.nc
precipitCorrelNC  = global_05min/meteo/downscaling_from_30min/precipitation_correl.nc

# windows length (unit: arc-degree) for smoothing/averaging forcing data (not recommended):
smoothingWindowsLength = 0


[landSurfaceOptions]

debugWaterBalance = True

numberOfUpperSoilLayers = 2

# soil and parameters
# - they are used for all land cover types, unless they are are defined in certain land cover type options 
#   (e.g. different/various soil types for agriculture areas)  
topographyNC     = global_05min/landSurface/topography/topography_parameters_5_arcmin_october_2015.nc
soilPropertiesNC = global_05min/landSurface/soil/soilProperties5ArcMin.nc

# netcdf time series for historical expansion of irrigation areas (unit: hectares). 
# Note: The resolution of this map must be consisten with the resolution of cellArea. 
historicalIrrigationArea = global_05min/waterUse/irrigation/irrigated_areas/irrigationArea05ArcMin.nc


[waterDemandOptions]
# option to calculate/include water use for irrigation purpose  
includeIrrigation = True

# default irrigation efficiency a pcraster map/value defining irrigation efficiency (dimensionless) - optional
# - note that it is also possible to define speficic-land-cover irrigation efficiency in each 'landCover' Options 
irrigationEfficiency     = global_30min/waterUse/irrigation/irrigation_efficiency/efficiency.map

# option to include non irrigation water demands  
includeDomesticWaterDemand       = True
includeIndustryWaterDemand       = True
includeLivestockWaterDemand      = True
includeManufactureWaterDemand    = True
includeThermoelectricWaterDemand = True

# domestic, industrial and livestock water demand data (unit must be in m.day-1)
# domesticWaterDemandFile     = global_05min/waterUse/waterDemand/domestic/domestic_water_demand_version_april_2015.nc
# industryWaterDemandFile     = global_05min/waterUse/waterDemand/industry/industry_water_demand_version_april_2015.nc
# livestockWaterDemandFile    = global_05min/waterUse/waterDemand/livestock/livestock_water_demand_version_april_2015.nc
domesticWaterDemandFile       = /eejit/depfg/sutan101/data/pcrglobwb_input_aqueduct/version_2021-09-16/historical_and_ssp_files/domestic_water_demand_historical_1960-2019.nc
industryWaterDemandFile       = /eejit/depfg/sutan101/data/pcrglobwb_input_aqueduct/version_2021-09-16/historical_and_ssp_files/industry_water_demand_historical_1960-2019.nc
livestockWaterDemandFile      = /eejit/depfg/sutan101/data/pcrglobwb_input_aqueduct/version_2021-09-16/general/livestock_water_demand_05min.nc
manufactureWaterDemandFile    = /scratch/carde003/Datasets/waterdemands/manufacture_water_demand_1980_2019_m_day_05arcmin.nc
thermoelectricWaterDemandFile = /scratch/carde003/Datasets/waterdemands/thermoelectric_water_demand_1980_2019_m_day_05arcmin.nc


[waterManagementOptions]
# using QUAlloc (or not)
using_qualloc                = False
configuration_file_for_qualloc = /home/carde003/github/qualloc_coupled/PCR-GLOBWB_model/model/water_management_qualloc/configuration_file_test.cfg

# limiting groundwater abstractions
# - pumpingCapacityNC: annual pumping capacity for each region (unit: billion cubic meter per year), should be given in a netcdf file
limitAbstraction                  = False
limitFossilGroundWaterAbstraction = False
pumpingCapacityNC                 = None

# if QUAlloc is not used (using_qualloc = False)
# extra water management related information should be provided:

## desalination water supply (maximum/potential/capacity)
desalinationWater = global_05min/waterUse/desalination/desalination_water_version_april_2015.nc

## zonal IDs at which allocation of desalined water, surface water, and groundwater sources are performed
## (if not defined, only local (pixel-scale) water availability is considered)
allocationSegmentsForDesalinatedWaterSource = global_05min/waterUse/abstraction_zones/abstraction_zones_60min_05min.nc
allocationSegmentsForSurfaceWaterSource     = global_05min/waterUse/abstraction_zones/abstraction_zones_60min_05min.nc
allocationSegmentsForGroundwaterSource      = global_05min/waterUse/abstraction_zones/abstraction_zones_30min_05min.nc

## limits for local groundwater abstraction values
## - limit for total groundwater abstraction (m/day)
maximumDailyGroundwaterAbstraction       = 0.050
## - limit for non-renewable groundwater abstraction (m/day)
maximumDailyFossilGroundwaterAbstraction = 0.020 

## maps defining the partitioning of groundwater - surface water source
## - predefined surface water - groundwater partitioning for irrigation demand (e.g. based on Siebert, Global Map of Irrigation Areas version 5)
irrigationSurfaceWaterAbstractionFractionData           = global_05min/waterUse/source_partitioning/surface_water_fraction_for_irrigation/AEI_SWFRAC.nc
## -- quality map
irrigationSurfaceWaterAbstractionFractionDataQuality    = global_05min/waterUse/source_partitioning/surface_water_fraction_for_irrigation/AEI_QUAL.nc

## - threshold values defining the preference for surface water source for irrigation purpose
## -- threshold to maximize surface water irrigation use (cells with irrSurfaceWaterAbstractionFraction above this will prioritize irrigation surface water use)
threshold_to_maximize_irrigation_surface_water          = 0.50
## -- threshold to minimize fossil water withdrawal for irrigation (cells with irrSurfaceWaterAbstractionFraction below this have no fossil withdrawal for irrigation)
threshold_to_minimize_fossil_groundwater_irrigation     = 0.70

## - predefined surface water - groundwater partitioning for non irrigation demand (e.g. based on McDonald, 2014)
maximumNonIrrigationSurfaceWaterAbstractionFractionData = global_30min/waterUse/source_partitioning/surface_water_fraction_for_non_irrigation/max_city_sw_fraction.nc


[forestOptions]
name = forest
debugWaterBalance = True

# snow module properties
snowModuleType      =  Simple
freezingT           =  0.0
degreeDayFactor     =  0.0025
