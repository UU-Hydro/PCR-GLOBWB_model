repos:
- repo: https://github.com/PyCQA/autoflake
  rev: v2.3.1
  hooks:
  - id: autoflake
    args: [--in-place, --remove-all-unused-imports]
        
  - id: autoflake
    alias: autoflake-check
    name: autoflake (diff check)
    args: [--check-diff, --remove-all-unused-imports]
    stages: [manual]

- repo: https://github.com/pycqa/isort
  rev: 6.0.1
  hooks:
  - id: isort
    args: [--profile, black]

  - id: isort
    alias: isort-check
    name: isort (diff check)
    args: [--profile, black, --check-only, --diff]
    stages: [manual]

- repo: https://github.com/psf/black
  rev: 22.10.0
  hooks:
  - id: black

  - id: black
    alias: black-check
    name: black (diff check)
    args: [--check, --diff]
    stages: [manual]

- repo: https://github.com/pycqa/flake8
  rev: 7.2.0
  hooks:
  - id: flake8
    args: [--max-line-length, "88", "--ignore", "E501,W503"]
    
  - id: flake8
    alias: flake8-check
    name: flake8 (diff check)
    args: [--max-line-length, "88", "--ignore", "E501,W503"]
    stages: [manual]