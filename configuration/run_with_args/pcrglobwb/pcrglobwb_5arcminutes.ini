[globalOptions]

# Please set the pcrglobwb output directory (outputDir) in an absolute path.
outputDir = MAIN_OUTPUT_DIR

# Set the input directory map in an absolute path.
inputDir = MAIN_INPUT_DIR

# Map of clone (must be provided in PCRaster maps)
cloneMap = CLONEMAP

# The area/landmask of interest:
landmask = clone_maps/tugela_5arcminutes.mask.map

# netcdf attributes for output files:
institution = Department of Physical Geography, Utrecht University
title       = PCR-GLOBWB 2 output
description = placeholder default configuration

#~ # Format: YYYY-MM-DD ; The model runs on daily time step.
startTime = 2000-01-01
# one week; QUAlloc's cfg takes whole years only, so an offline run outruns this forcing
endTime = 2000-01-07

# spinning up options:
maxSpinUpsInYears = 0
minConvForSoilSto = 0.0
minConvForGwatSto = 0.0
minConvForChanSto = 0.0
minConvForTotlSto = 0.0

# option/directory for saving the spin-up directory 
spinUpOutputDir = False

[meteoOptions]

# Set the forcing temperature and precipitation files (relative to inputDir)
precipitationNC = forcing/w5e5/pr_1979-2019_mm_per_day.nc
temperatureNC = forcing/w5e5/tas_1979-2019.nc
# Method to calculate referencePotETP (reference potential evaporation+transpiration)
# options are "Hamon" and "Input" ; If "Input", the netcdf input file must be given:
referenceETPotMethod = Input
refETPotFileNC = forcing/w5e5/refPotEvap_1979-2019.nc

# DynQual water temperature forcing; read only when [routingOptions] quality is True
sunhoursTable = forcing/sunhoursfrac.tbl
cloudcoverNC  = forcing/cru/cloudCover_cru_ts3.21.nc
radiationNC   = forcing/w5e5/rsds_W5E5v2.0_19790101-20191231_with_climatology_on_1978_wm-2.nc
vaporNC       = forcing/cru/vap_cru_ts3.21.nc
annualAvgTNC  = forcing/w5e5/tas_W5E5v2.0_19790101-20191231_annAvg_C.nc


# conversion constants and factors to correct forcing values (optional) so that the units are in m.day-1 and degree Celcius                                                                                                           
temperatureConstant      = -273.15
temperatureFactor        = 1.0
precipitationConstant    = 0.0
precipitationFactor      = 0.001


# initial conditions:
avgAnnualDiurnalDeltaTempIni = 0.001
avgAnnualPrecipitationIni = 0.001
avgAnnualTemperatureIni   = 0.001

[meteoDownscalingOptions]
downscalePrecipitation = True
downscaleTemperature = True
downscaleReferenceETPot = True


# Downscaling Based on Daily Correction Factor
using_daily_factor_for_downscaling = True
precip_downscaling_factor_file = forcing/downscaling/CHELSA_doy_factor/5arcminutes/tp_correction_factor.zarr
precip_drydays_file =            forcing/downscaling/CHELSA_doy_factor/5arcminutes/dry_days_cutoff.zarr
temp_downscaling_factor_file =   forcing/downscaling/CHELSA_doy_factor/5arcminutes/ta_correction_factor.zarr
evap_downscaling_factor_file =   forcing/downscaling/CHELSA_doy_factor/5arcminutes/pet_correction_factor.zarr
# downscaling (based on the digital elevation model):                                                                                                          
highResolutionDEM = forcing/downscaling/lapse_rate_approach/gtopo05min.nc

# The downscaling will be performed by providing the "cellIds" (meteoDownscaleIds) of lower resolution cells.                                                    
meteoDownscaleIds = forcing/downscaling/lapse_rate_approach/uniqueIds_30min.nc

# lapse rates:                                                                                                                                                   
temperLapseRateNC = forcing/downscaling/lapse_rate_approach/temperature_slope.nc
precipLapseRateNC = forcing/downscaling/lapse_rate_approach/precipitation_slope.nc

# downscaling criteria (TODO: remove these):                                                                                                                     
temperatCorrelNC = forcing/downscaling/lapse_rate_approach/temperature_correl.nc
precipitCorrelNC = forcing/downscaling/lapse_rate_approach/precipitation_correl.nc

# windows length (unit: arc-degree) for smoothing/averaging forcing data (not recommended):                                                                      
smoothingWindowsLength = 0

[landSurfaceOptions]

debugWaterBalance = True

numberOfUpperSoilLayers = 2

# topography parameters
# - they are used for all land cover types, unless they are are defined in certain land cover type options 
#   (e.g. different/various soil types for agriculture areas)  


topographyNC = 5arcminutes/land_surface/topography/merit_2021/topography_parameters_5min_april_2021_global_covered_with_zero.nc

soilPropertiesNC = 5arcminutes/land_surface/soil/soilProperties5ArcMin.nc
; # - if soilPropertiesNC = None, the following soil parameters will be used
; firstStorDepth       = 5arcminutes/land_surface/soil/version_2021-05-XX/layerDepth_average_1_global_05arcmin.nc
; secondStorDepth      = 5arcminutes/land_surface/soil/version_2021-05-XX/layerDepth_average_2_global_05arcmin.nc
; soilWaterStorageCap1 = 5arcminutes/land_surface/soil/version_2021-05-XX/WHC_average_1_global_05arcmin.nc
; soilWaterStorageCap2 = 5arcminutes/land_surface/soil/version_2021-05-XX/WHC_average_2_global_05arcmin.nc
; airEntryValue1       = 5arcminutes/land_surface/soil/version_2021-05-XX/psiAir_average_1_global_05arcmin.nc
; airEntryValue2       = 5arcminutes/land_surface/soil/version_2021-05-XX/psiAir_average_2_global_05arcmin.nc
; poreSizeBeta1        = 5arcminutes/land_surface/soil/version_2021-05-XX/BCH_average_1_global_05arcmin.nc
; poreSizeBeta2        = 5arcminutes/land_surface/soil/version_2021-05-XX/BCH_average_2_global_05arcmin.nc
; resVolWC1            = 5arcminutes/land_surface/soil/version_2021-05-XX/vmcRes_average_1_global_05arcmin.nc
; resVolWC2            = 5arcminutes/land_surface/soil/version_2021-05-XX/vmcRes_average_2_global_05arcmin.nc
; satVolWC1            = 5arcminutes/land_surface/soil/version_2021-05-XX/vmcSat_average_1_global_05arcmin.nc
; satVolWC2            = 5arcminutes/land_surface/soil/version_2021-05-XX/vmcSat_average_2_global_05arcmin.nc
; KSat1                = 5arcminutes/land_surface/soil/version_2021-05-XX/kSat_average_1_global_05arcmin.nc
; KSat2                = 5arcminutes/land_surface/soil/version_2021-05-XX/kSat_average_2_global_05arcmin.nc
; percolationImp = 5arcminutes/land_surface/impeded_drainage/5arcminute_impeded_drainage_permafrost_dsmw_correct_lats.nc

# option to skip extrapolation
noParameterExtrapolation = True

[waterDemandOptions]
includeIrrigation = True

#~ # netcdf time series for hiqstorical expansion of irrigation areas (unit: hectares). 
#~ # Note: The resolution of this map must be consisten with the resolution of cellArea. 
historicalIrrigationArea = 5arcminutes/water_use/irrigation/irrigation_area_05min.nc

# land cover classes
landCoverTypes = forest,grassland,irrPaddy,irrNonPaddy
# we have to correct land cover fractions
noLandCoverFractionCorrection = False

# a pcraster map/value defining irrigation efficiency (dimensionless) - optional
irrigationEfficiency = 30arcminutes/water_use/irrigation/efficiency.nc

includeDomesticWaterDemand = True
includeIndustryWaterDemand = True
includeLivestockWaterDemand = True
includeManufactureWaterDemand    = False
includeThermoelectricWaterDemand = False

# domestic, industrial and livestock water demand data (unit must be in m.day-1)
domesticWaterDemandFile = 5arcminutes/water_use/demand/domestic.nc
industryWaterDemandFile = 5arcminutes/water_use/demand/industry.nc
livestockWaterDemandFile = 5arcminutes/water_use/demand/livestock.nc


[waterManagementOptions]
# PCR-GLOBWB does its own water allocation (landSurface.py, the else branch)
using_qualloc                = False
# desalination water supply (maximum/potential/capacity)
; desalinationWater = 5arcminutes/water_use/desalination.nc
desalinationWater = None


# zone IDs (scale) at which allocations of groundwater and surface water (as well as desalinated water) are performed  
allocationSegmentsForGroundSurfaceWater = 5arcminutes/water_use/abstraction_zones/abstraction_zones_60min_05min.nc

# pcraster maps defining the partitioning of groundwater - surface water source 
#
# - predefined surface water - groundwater partitioning for irrigation demand (e.g. based on Siebert, Global Map of Irrigation Areas version 5)
irrigationSurfaceWaterAbstractionFractionData = 5arcminutes/water_use/irrigation/surface_water_fraction.nc
# -- quality map
irrigationSurfaceWaterAbstractionFractionDataQuality = 5arcminutes/water_use/irrigation/surface_water_fraction_quality.nc

# - threshold values defining the preference for surface water source for irrigation purpose
# -- treshold to maximize surface water irrigation use (cells with irrSurfaceWaterAbstractionFraction above this will prioritize irrigation surface water use)
treshold_to_maximize_irrigation_surface_water = 0.50
# -- treshold to minimize fossil water withdrawal for irrigation (cells with irrSurfaceWaterAbstractionFraction below this have no fossil withdrawal for irrigation)
treshold_to_minimize_fossil_groundwater_irrigation = 0.70

# - predefined surface water - groundwater partitioning for non irrigation demand (e.g. based on McDonald, 2014)
maximumNonIrrigationSurfaceWaterAbstractionFractionData = 30arcminutes/water_use/non_irrigation_surface_water_fraction_max.nc


# option to skip extrapolation
noParameterExtrapolation = True

[forestOptions]
name = forest
debugWaterBalance = True

# snow module properties
snowModuleType = Simple
freezingT = 0.0
degreeDayFactor = 0.0055
snowWaterHoldingCap = 0.1
refreezingCoeff = 0.05

# other paramater values
minTopWaterLayer = 0.0
minCropKC = 0.2

cropCoefficientNC = 5arcminutes/land_surface/land_cover/natural_tall/crop_coefficient.nc
interceptCapNC = 5arcminutes/land_surface/land_cover/natural_tall/intercept_cap.nc
coverFractionNC = 5arcminutes/land_surface/land_cover/natural_tall/cover_fraction.nc

landCoverMapsNC = None
# If NC file is not provided, we have to provide the following pcraster maps:
fracVegCover = 5arcminutes/land_surface/land_cover/natural_tall/frac_veg_cover.nc
minSoilDepthFrac = 30arcminutes/land_surface/land_cover/natural_tall/min_soil_depth_frac.nc
maxSoilDepthFrac = 30arcminutes/land_surface/land_cover/natural_tall/max_soil_depth_frac.nc
rootFraction1 = 5arcminutes/land_surface/land_cover/natural_tall/root_fraction_1.nc
rootFraction2 = 5arcminutes/land_surface/land_cover/natural_tall/root_fraction_2.nc
