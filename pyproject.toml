[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcrglobwb"
version = "2.1.0"
description = "PCR-GLOBWB global hydrological model (with DynQual and QUAlloc)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

[project.scripts]
pcrglobwb-run = "pcrglobwb.deterministic_runner:main"
pcrglobwb-run-with-arguments = "pcrglobwb.deterministic_runner_with_arguments:main"
qualloc-run = "qualloc.qualloc_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcrglobwb", "src/qualloc"]

[tool.vulture]
paths = ["src"]
# callbacks invoked by the PCRaster (Dynamic|Static)Framework
ignore_names = ["initial", "dynamic"]
