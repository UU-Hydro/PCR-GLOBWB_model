name: Format and Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pixi (lint environment)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.80.0
          environments: lint
          cache: true

      - name: Run format and lint checks
        run: pixi run -e lint pre-commit run --all-files --hook-stage manual
