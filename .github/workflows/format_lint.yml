name: Format and Lint

on: [push, pull_request]

permissions:
  contents: read

env:
  FROM_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  TO_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
      - name: Install pre-commit
        run: pip install pre-commit==4.6.2
      - name: Run pre-commit
        run: |
          pre-commit run --hook-stage manual --from-ref "$FROM_REF" --to-ref "$TO_REF" autoflake-check
          pre-commit run --hook-stage manual --from-ref "$FROM_REF" --to-ref "$TO_REF" isort-check
          pre-commit run --hook-stage manual --from-ref "$FROM_REF" --to-ref "$TO_REF" black-check
          pre-commit run --from-ref "$FROM_REF" --to-ref "$TO_REF" flake8-check
